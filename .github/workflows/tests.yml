name: Test Proyect
run-name: Run tests of ${{ inputs.deploy_target }} by @${{ github.actor }}
on: pull_request
jobs:
  test-python:
    name: Run Python Tests
    runs-on: ubuntu-latest
    container: python:3.10
    defaults:
      run:
        working-directory: ./Habitus
    steps:
      - name: Container on Checkout Code
        uses: actions/checkout@v3
        with:
          python-version: 3.10
      - name: Install dependencies
        run: |
          pip install pytest
          pip install -r ./backend_python/requirements.txt
      - name: Run tests
        run: pytest
  test-java:
    name: Run Java Tests
    runs-on: ubuntu-latest
    container: eclipse-temurin:17-jdk-focal
    defaults:
      run:
        working-directory: ./Habitus/backend-java/authservice
    steps:
      - name: Container on Checkout Code
        uses: actions/checkout@v3
        with:
          python-version: 3.10
      - name: Change Permissions on mvnw
        run: chmod +x mvnw
      - name: Run tests
        run: ./mvnw test