services:
  postgres:
    image: postgres:15
    container_name: habitus_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: habitus
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    restart: always
    networks:
      - database

  pgadmin:
    image: dpage/pgadmin4
    container_name: habitus_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "${PGA_PORT:-5050}:80"
    depends_on:
      - postgres
    restart: always
    networks:
      - database
  
  python:
    build: ./backend_python/
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/habitus"
    ports:
      - "${PY_PORT:-8000}:8000"
    depends_on:
      - postgres
    networks:
      - database
      - frontend
    volumes:
      - ./backend_python:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: on-failure

  java:
    build: ./backend-java/
    environment:
      DB_URL: "jdbc:postgresql://postgres:5432/habitus"
      FRONTEND_URL: "http://frontend:8001"
    depends_on:
      - postgres
    ports:
      - "${JAVA_PORT:-8080}:8080"
    networks:
      - database
      - frontend

  frontend:
    build: ./frontend/
    depends_on:
      - python
      - java
    ports:
      - "${FRONT_PORT:-8001}:8001"
    networks:
      - frontend
networks:
  database:
  frontend:
